name: CI Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: Dependency vulnerability check
        run: npm audit --audit-level=high || true

  backend:
    name: Backend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: Dependency vulnerability check
        run: npm audit --audit-level=high || true

  secret-and-guardrail-scan:
    name: Secret & Prohibited Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no committed .env files or Lucide imports
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local)?$'; then
            echo "Committed .env file detected!"
            exit 1
          fi
          if grep -rn "lucide-react" frontend/src/ backend/src/ 2>/dev/null; then
            echo "Prohibited lucide-react import detected! Use @phosphor-icons/react."
            exit 1
          fi
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|SARVAM_API_KEY|LLM_API_KEY" frontend/src/ 2>/dev/null; then
            echo "Server-side secret referenced in frontend source!"
            exit 1
          fi
